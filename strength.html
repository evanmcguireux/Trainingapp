<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "Arial", "sans-serif"] } } } }
  </script>
  <title>Strength</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="strength" class="bg-[#0b0d0f] text-white antialiased">
  <main class="mx-auto min-h-screen w-[min(430px,100%)] bg-[#111417] px-5 pb-28 pt-8">
    <header class="mb-5">
      <p class="text-xs font-black uppercase tracking-wider text-[#ff6b2b]">Strength</p>
      <h1 class="mt-2 text-4xl font-black tracking-[-.06em]">Strength</h1>
    </header>

    <section class="mb-5 flex gap-2 overflow-x-auto pb-1 [scrollbar-width:none]">
      <button data-strength-category="Lower" class="strength-tab flex min-h-12 shrink-0 touch-manipulation items-center rounded-full border border-[#ff6b2b] bg-[#ff6b2b]/10 px-5 text-sm font-black text-[#ff6b2b] transition hover:bg-[#ff6b2b]/15 focus:outline-none focus:ring-2 focus:ring-[#ff6b2b]/70 active:scale-[.98]">Lower</button>
      <button data-strength-category="Upper" class="strength-tab flex min-h-12 shrink-0 touch-manipulation items-center rounded-full border border-white/25 px-5 text-sm font-black text-zinc-300 transition hover:bg-white/5 hover:text-white focus:outline-none focus:ring-2 focus:ring-[#ff6b2b]/70 active:scale-[.98]">Upper</button>
      <button data-strength-category="Calf" class="strength-tab flex min-h-12 shrink-0 touch-manipulation items-center rounded-full border border-white/25 px-5 text-sm font-black text-zinc-300 transition hover:bg-white/5 hover:text-white focus:outline-none focus:ring-2 focus:ring-[#ff6b2b]/70 active:scale-[.98]">Calf</button>
    </section>

    <section id="strengthList" class="grid gap-4"></section>

    <section id="strengthFormCard" class="mt-5 rounded-[28px] bg-[#202428] p-5 shadow-[0_22px_70px_rgba(0,0,0,.34)] ring-1 ring-white/5">
      <div class="mb-5 flex items-start justify-between gap-4">
        <div>
          <span class="text-xs font-black uppercase tracking-wider text-zinc-500">Log</span>
          <h2 id="strengthFormTitle" class="mt-1 text-2xl font-black tracking-tight">Exercise</h2>
        </div>
        <span id="strengthFormCategoryPill" class="rounded-full bg-white/10 px-3 py-1 text-[11px] font-black uppercase tracking-wide text-zinc-300">Lower</span>
      </div>

      <div class="grid gap-4">
        <label class="text-xs font-bold text-zinc-400">Exercise
          <select id="strengthExercise" class="mt-2 h-12 w-full rounded-2xl bg-[#111417] px-3 text-base text-white outline-none ring-1 ring-white/10 focus:ring-2 focus:ring-[#ff6b2b]/70"></select>
        </label>
        <label class="text-xs font-bold text-zinc-400">Category
          <select id="strengthCategory" class="mt-2 h-12 w-full rounded-2xl bg-[#111417] px-3 text-base text-white outline-none ring-1 ring-white/10 focus:ring-2 focus:ring-[#ff6b2b]/70">
            <option>Lower</option><option>Upper</option><option>Calf</option>
          </select>
        </label>
        <div class="grid grid-cols-3 gap-3">
          <label class="text-xs font-bold text-zinc-400">Weight
            <input id="strengthWeight" type="number" min="0" step="0.5" placeholder="kg" class="mt-2 h-12 w-full rounded-2xl bg-[#111417] px-3 text-base text-white outline-none ring-1 ring-white/10 placeholder:text-zinc-600 focus:ring-2 focus:ring-[#ff6b2b]/70">
          </label>
          <label class="text-xs font-bold text-zinc-400">Sets
            <input id="strengthSets" type="number" min="1" step="1" placeholder="3" class="mt-2 h-12 w-full rounded-2xl bg-[#111417] px-3 text-base text-white outline-none ring-1 ring-white/10 placeholder:text-zinc-600 focus:ring-2 focus:ring-[#ff6b2b]/70">
          </label>
          <label class="text-xs font-bold text-zinc-400">Reps
            <input id="strengthReps" type="number" min="1" step="1" placeholder="8" class="mt-2 h-12 w-full rounded-2xl bg-[#111417] px-3 text-base text-white outline-none ring-1 ring-white/10 placeholder:text-zinc-600 focus:ring-2 focus:ring-[#ff6b2b]/70">
          </label>
        </div>
        <button id="strengthSave" type="button" class="min-h-14 touch-manipulation rounded-full bg-[#ff6b2b] text-base font-black text-white shadow-[0_16px_35px_rgba(255,107,43,.32)] transition hover:bg-[#ff7a3d] focus:outline-none focus:ring-2 focus:ring-[#ff6b2b]/70 active:scale-[.97]">Save</button>
      </div>
    </section>

    <nav aria-label="Mobile navigation" class="fixed inset-x-0 bottom-4 z-50 mx-auto grid w-[min(390px,calc(100%-28px))] grid-cols-5 gap-1 rounded-full bg-[#202428]/95 p-2 shadow-[0_20px_70px_rgba(0,0,0,.55)] ring-1 ring-white/10 backdrop-blur">
      <a data-nav="home" href="index.html" class="group flex min-h-12 touch-manipulation flex-col items-center justify-center rounded-full text-xs font-bold text-zinc-400 transition hover:bg-white/5 hover:text-white focus:outline-none focus:ring-2 focus:ring-[#ff6b2b]/60 active:scale-95">⌂<span class="mt-0.5">Home</span></a>
      <a data-nav="plan" href="plan.html" class="group flex min-h-12 touch-manipulation flex-col items-center justify-center rounded-full text-xs font-bold text-zinc-400 transition hover:bg-white/5 hover:text-white focus:outline-none focus:ring-2 focus:ring-[#ff6b2b]/60 active:scale-95">◷<span class="mt-0.5">Plan</span></a>
      <a data-nav="log" href="log.html" class="-mt-5 flex min-h-14 touch-manipulation flex-col items-center justify-center rounded-full bg-[#ff6b2b] text-xs font-black text-white shadow-[0_16px_35px_rgba(255,107,43,.35)] transition hover:bg-[#ff7a3d] focus:outline-none focus:ring-2 focus:ring-[#ff6b2b]/70 active:scale-95">＋<span class="mt-0.5">Log</span></a>
      <a data-nav="strength" href="strength.html" class="group flex min-h-12 touch-manipulation flex-col items-center justify-center rounded-full text-xs font-bold text-zinc-400 transition hover:bg-white/5 hover:text-white focus:outline-none focus:ring-2 focus:ring-[#ff6b2b]/60 active:scale-95">◴<span class="mt-0.5">Strength</span></a>
      <a data-nav="progress" href="progress.html" class="group flex min-h-12 touch-manipulation flex-col items-center justify-center rounded-full text-xs font-bold text-zinc-400 transition hover:bg-white/5 hover:text-white focus:outline-none focus:ring-2 focus:ring-[#ff6b2b]/60 active:scale-95">◎<span class="mt-0.5">Trend</span></a>
    </nav>
    <script src="app.js"></script>
  </main>
</body>
</html>
