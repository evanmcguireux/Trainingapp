<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={theme:{extend:{fontFamily:{sans:["Inter","ui-sans-serif","system-ui","-apple-system","BlinkMacSystemFont","Segoe UI","Arial","sans-serif"]}}}}
  </script>
  <title>TriBuild Plan</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="plan" class="bg-[#0b0d0f] text-white antialiased">
  <main class="mx-auto min-h-screen w-[min(430px,100%)] bg-[#111417] px-5 pb-28 pt-8">
    <header class="mb-5">
      <p class="text-xs font-black uppercase tracking-wider text-[#ff6b2b]">Plan</p>
      <h1 id="weekTitle" class="mt-2 text-4xl font-black tracking-[-.06em]">Week</h1>
      <p id="weekHint" class="mt-2 text-sm leading-5 text-zinc-400">Loading</p>
    </header>

    <section class="mb-4">
      <label class="block rounded-[24px] bg-[#202428] p-3 text-xs font-bold text-zinc-400 shadow-[0_18px_55px_rgba(0,0,0,.28)] ring-1 ring-white/5">
        Week
        <select id="weekSelect" class="mt-2 h-12 w-full rounded-2xl bg-[#111417] px-3 text-base text-white outline-none ring-1 ring-white/10 focus:ring-2 focus:ring-[#ff6b2b]/70"></select>
      </label>
    </section>

    <section class="mb-4 rounded-[28px] bg-[#202428] p-5 shadow-[0_22px_70px_rgba(0,0,0,.34)] ring-1 ring-white/5">
      <div class="flex items-start justify-between gap-4">
        <div>
          <span class="text-xs font-black uppercase tracking-wider text-zinc-500">Week at a glance</span>
          <h2 id="planRatio" class="mt-2 text-3xl font-black tracking-tight">15 / 30 / 45</h2>
          <p id="planSummary" class="mt-1 text-sm leading-5 text-zinc-400">Six runs, three bikes, strength and calf work.</p>
        </div>
        <span id="planPhasePill" class="rounded-full bg-[#ff6b2b]/15 px-3 py-1 text-[11px] font-black uppercase tracking-wide text-[#ff6b2b]">Base</span>
      </div>
      <div class="mt-5 grid grid-cols-3 gap-3">
        <div class="rounded-[20px] bg-white/7 p-3 ring-1 ring-white/5">
          <p class="text-xs font-bold text-zinc-500">Run</p>
          <p id="planRunTotal" class="mt-1 text-xl font-black">0m</p>
        </div>
        <div class="rounded-[20px] bg-white/7 p-3 ring-1 ring-white/5">
          <p class="text-xs font-bold text-zinc-500">Bike</p>
          <p id="planBikeTotal" class="mt-1 text-xl font-black">0m</p>
        </div>
        <div class="rounded-[20px] bg-white/7 p-3 ring-1 ring-white/5">
          <p class="text-xs font-bold text-zinc-500">Key</p>
          <p id="planKeySession" class="mt-1 text-xl font-black">Long</p>
        </div>
      </div>
    </section>

    <section class="mb-3 flex items-center justify-between">
      <h2 class="text-2xl font-black tracking-tight">This week</h2>
      <a href="log.html" class="rounded-full bg-[#ff6b2b] px-4 py-2 text-sm font-black text-white shadow-[0_12px_28px_rgba(255,107,43,.28)] transition hover:bg-[#ff7a3d] focus:outline-none focus:ring-2 focus:ring-[#ff6b2b]/70 active:scale-[.98]">Log today</a>
    </section>

    <section id="planList" class="grid gap-4"></section>

    <nav aria-label="Mobile navigation" class="fixed inset-x-0 bottom-4 z-50 mx-auto grid w-[min(390px,calc(100%-28px))] grid-cols-5 gap-1 rounded-full bg-[#202428]/95 p-2 shadow-[0_20px_70px_rgba(0,0,0,.55)] ring-1 ring-white/10 backdrop-blur">
      <a data-nav="home" href="index.html" class="group flex min-h-12 touch-manipulation flex-col items-center justify-center rounded-full text-xs font-bold text-zinc-400 transition hover:bg-white/5 hover:text-white focus:outline-none focus:ring-2 focus:ring-[#ff6b2b]/60 active:scale-95"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M9 20v-6h6v6"></path></svg><span class="mt-0.5">Home</span></a>
      <a data-nav="plan" href="plan.html" class="group flex min-h-12 touch-manipulation flex-col items-center justify-center rounded-full text-xs font-bold text-zinc-400 transition hover:bg-white/5 hover:text-white focus:outline-none focus:ring-2 focus:ring-[#ff6b2b]/60 active:scale-95"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M3 10h18"></path></svg><span class="mt-0.5">Plan</span></a>
      <a data-nav="log" href="log.html" class="-mt-5 flex min-h-14 touch-manipulation flex-col items-center justify-center rounded-full bg-[#ff6b2b] text-xs font-black text-white shadow-[0_16px_35px_rgba(255,107,43,.35)] transition hover:bg-[#ff7a3d] focus:outline-none focus:ring-2 focus:ring-[#ff6b2b]/70 active:scale-95"><svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg><span class="mt-0.5">Log</span></a>
      <a data-nav="strength" href="strength.html" class="group flex min-h-12 touch-manipulation flex-col items-center justify-center rounded-full text-xs font-bold text-zinc-400 transition hover:bg-white/5 hover:text-white focus:outline-none focus:ring-2 focus:ring-[#ff6b2b]/60 active:scale-95"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5 17.5 17.5"></path><path d="M21 21 3 3"></path><path d="M14 5a3 3 0 0 1 5 2.2"></path><path d="M5 14a3 3 0 0 0 2.2 5"></path></svg><span class="mt-0.5">Strength</span></a>
      <a data-nav="progress" href="progress.html" class="group flex min-h-12 touch-manipulation flex-col items-center justify-center rounded-full text-xs font-bold text-zinc-400 transition hover:bg-white/5 hover:text-white focus:outline-none focus:ring-2 focus:ring-[#ff6b2b]/60 active:scale-95"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="m7 14 4-4 3 3 5-6"></path></svg><span class="mt-0.5">Trend</span></a>
    </nav>
    <script src="app.js"></script>
  </main>
</body>
</html>
