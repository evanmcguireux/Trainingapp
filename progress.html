<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TriBuild Progress</title><link rel="stylesheet" href="styles.css"></head><body data-page="progress"><main class="app">
<header class="header"><div><p class="tiny">Hello, Evan</p><h1>TriBuild</h1><p class="intro">A simple Achilles-aware triathlon training app for your 12-week BarryP base build.</p></div><div class="readiness" id="readinessCard"><span>Readiness</span><strong id="readinessText">Not logged</strong><small id="readinessHint">Log today to get a recommendation.</small></div></header>
<nav class="controls"><div class="field"><label for="weekSelect">Week</label><select id="weekSelect"></select></div><div class="field"><label for="daySelect">Day</label><select id="daySelect"></select></div><div class="field"><label for="longBike">Long bike</label><input id="longBike" type="number" min="45" max="240" value="90"></div><button class="reset" id="resetButton" type="button">Reset</button></nav>
<section class="charts"><article class="chart"><h2>Weekly run minutes</h2><div class="bar-list" id="runChart"></div></article><article class="chart"><h2>Long run trend</h2><div class="bar-list" id="longRunChart"></div></article><article class="chart"><h2>Pain trend</h2><div class="bar-list" id="painChart"></div></article><article class="chart"><h2>Stiffness trend</h2><div class="bar-list" id="stiffChart"></div></article><article class="chart"><h2>Completed sessions</h2><div class="bar-list" id="completedChart"></div></article><article class="chart"><h2>Deload weeks</h2><div class="bar-list" id="deloadChart"></div></article></section>
