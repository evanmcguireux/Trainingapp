<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={theme:{extend:{fontFamily:{sans:["Inter","ui-sans-serif","system-ui","-apple-system","BlinkMacSystemFont","Segoe UI","Arial","sans-serif"]}}}}
  </script>
  <title>Trend</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="progress" class="bg-black text-white antialiased">
  <main class="mx-auto min-h-screen w-[min(430px,100%)] bg-[#050505] pb-28 text-white">
    <header class="px-5 pt-7">
      <div class="flex items-center justify-between">
        <div class="grid h-14 w-14 place-items-center rounded-[18px] border-2 border-[#fc4c02] bg-[#141414] shadow-[0_14px_30px_rgba(252,76,2,.18)]">
          <span class="text-lg font-black text-[#fc4c02]">TB</span>
        </div>
        <h1 class="text-3xl font-black tracking-[-.05em]">You</h1>
        <div class="flex gap-3">
          <button class="grid h-14 w-14 touch-manipulation place-items-center rounded-full bg-[#171717] text-white shadow-[0_18px_45px_rgba(0,0,0,.55)] ring-1 ring-white/10 transition hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-[#fc4c02]/70 active:scale-95" aria-label="Add">
            <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
          </button>
          <button class="grid h-14 w-14 touch-manipulation place-items-center rounded-full bg-[#171717] text-white shadow-[0_18px_45px_rgba(0,0,0,.55)] ring-1 ring-white/10 transition hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-[#fc4c02]/70 active:scale-95" aria-label="Settings">
            <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.72l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <nav class="mt-10 grid grid-cols-3 border-b border-white/20 text-center">
        <button class="relative pb-4 text-2xl font-black tracking-[-.04em] text-white">Progress<span class="absolute inset-x-0 -bottom-[1px] mx-auto h-1 w-full bg-[#fc4c02]"></span></button>
        <button class="pb-4 text-2xl font-black tracking-[-.04em] text-zinc-500">Workouts</button>
        <button class="pb-4 text-2xl font-black tracking-[-.04em] text-zinc-500">Activities</button>
      </nav>
    </header>

    <section class="px-5 pt-5">
      <article class="mb-5 flex min-h-20 items-center justify-between rounded-[28px] bg-[#161616] px-5 py-4 shadow-[0_20px_55px_rgba(0,0,0,.45)] ring-1 ring-white/5">
        <div class="flex items-center gap-4">
          <div class="grid h-12 w-12 place-items-center rounded-2xl border-2 border-[#fc4c02] text-[#fc4c02]">
            <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 12 4v10l-6 4-6-4V3Z"></path><path d="m9 14 3-6 3 5"></path><path d="m10 14 2 3 2-4"></path></svg>
          </div>
          <h2 class="text-3xl font-black tracking-[-.05em]">What’s your focus?</h2>
        </div>
        <svg class="h-7 w-7 text-zinc-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
      </article>

      <article class="rounded-[30px] bg-[#161616] p-5 shadow-[0_22px_70px_rgba(0,0,0,.50)] ring-1 ring-white/5">
        <div class="mb-7 flex gap-2 overflow-x-auto pb-1 [scrollbar-width:none]">
          <button data-discipline="run" class="discipline-tab flex min-h-12 shrink-0 touch-manipulation items-center gap-2 rounded-full border border-[#fc4c02] px-4 text-base font-semibold text-[#fc4c02] transition hover:bg-[#fc4c02]/10 focus:outline-none focus:ring-2 focus:ring-[#fc4c02]/70 active:scale-[.98]">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4v5l4 3"></path><path d="m8 8 2-3 3 1"></path><path d="m9 17-2 3"></path><path d="m14 17 3 3"></path><path d="M9 12h5"></path></svg>
            Run
          </button>
          <button data-discipline="bike" class="discipline-tab flex min-h-12 shrink-0 touch-manipulation items-center gap-2 rounded-full border border-white/30 px-4 text-base font-semibold text-zinc-300 transition hover:bg-white/5 hover:text-white focus:outline-none focus:ring-2 focus:ring-[#fc4c02]/70 active:scale-[.98]">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"></circle><circle cx="18.5" cy="17.5" r="3.5"></circle><path d="M15 6h3l-3 7H9"></path><path d="m9 13-2-4H4"></path><path d="m9 13-3.5 4.5"></path><path d="M15 13l3.5 4.5"></path></svg>
            Bike
          </button>
          <button data-discipline="swim" class="discipline-tab flex min-h-12 shrink-0 touch-manipulation items-center gap-2 rounded-full border border-white/30 px-4 text-base font-semibold text-zinc-300 transition hover:bg-white/5 hover:text-white focus:outline-none focus:ring-2 focus:ring-[#fc4c02]/70 active:scale-[.98]">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18c2 0 2-1 4-1s2 1 4 1 2-1 4-1 2 1 4 1 2-1 4-1"></path><path d="M2 22c2 0 2-1 4-1s2 1 4 1 2-1 4-1 2 1 4 1 2-1 4-1"></path><path d="M15 9a3 3 0 1 0-3-3"></path><path d="M12 6 7 11l5 2 4-4"></path></svg>
            Swim
          </button>
          <button data-discipline="strength" class="discipline-tab flex min-h-12 shrink-0 touch-manipulation items-center gap-2 rounded-full border border-white/30 px-4 text-base font-semibold text-zinc-300 transition hover:bg-white/5 hover:text-white focus:outline-none focus:ring-2 focus:ring-[#fc4c02]/70 active:scale-[.98]">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 17.5 17.5"></path><path d="M21 21 3 3"></path><path d="M14 5a3 3 0 0 1 5 2.2"></path><path d="M5 14a3 3 0 0 0 2.2 5"></path></svg>
            Strength
          </button>
        </div>

        <h3 class="text-3xl font-black tracking-[-.04em]">This week</h3>
        <div class="mt-5 grid grid-cols-3 gap-4">
          <div><p id="metricOneLabel" class="text-base text-zinc-300">Distance</p><p id="metricOneValue" class="mt-1 text-3xl font-black tracking-tight">0 km</p></div>
          <div><p id="metricTwoLabel" class="text-base text-zinc-300">Time</p><p id="metricTwoValue" class="mt-1 text-3xl font-black tracking-tight">0m</p></div>
          <div><p id="metricThreeLabel" class="text-base text-zinc-300">Load</p><p id="metricThreeValue" class="mt-1 text-3xl font-black tracking-tight">0</p></div>
        </div>

        <div class="mt-8">
          <div class="mb-4 flex items-center justify-between">
            <p class="text-lg font-medium text-zinc-200">Past 12 weeks</p>
            <p id="trendUnit" class="text-sm font-semibold text-zinc-400">minutes</p>
          </div>
          <div id="disciplineChart" class="relative h-[255px] rounded-[24px] bg-[#111111] p-4 ring-1 ring-white/5"></div>
        </div>

        <button class="mt-6 flex min-h-14 w-full touch-manipulation items-center justify-center rounded-full border border-white/40 px-4 text-lg font-black text-white transition hover:bg-white/5 focus:outline-none focus:ring-2 focus:ring-[#fc4c02]/70 active:scale-[.98]">
          See more of your progress
        </button>
      </article>

      <section class="mt-5 grid grid-cols-2 gap-3">
        <article class="rounded-[28px] bg-[#161616] p-5 shadow-[0_22px_70px_rgba(0,0,0,.50)] ring-1 ring-white/5">
          <span class="text-xs font-black uppercase tracking-wider text-zinc-500">Consistency</span>
          <strong id="consistencyValue" class="mt-7 block text-5xl font-black tracking-tight">0%</strong>
          <p class="mt-2 text-sm leading-5 text-zinc-400">planned sessions completed</p>
        </article>
        <article class="rounded-[28px] bg-[#161616] p-5 shadow-[0_22px_70px_rgba(0,0,0,.50)] ring-1 ring-white/5">
          <span class="text-xs font-black uppercase tracking-wider text-zinc-500">Load response</span>
          <strong id="loadResponseValue" class="mt-7 block text-3xl font-black tracking-tight">Not logged</strong>
          <p id="loadResponseHint" class="mt-2 text-sm leading-5 text-zinc-400">Log pain and stiffness to populate this.</p>
        </article>
      </section>
    </section>

    <nav aria-label="Mobile navigation" class="fixed inset-x-0 bottom-4 z-50 mx-auto grid w-[min(390px,calc(100%-28px))] grid-cols-5 gap-1 rounded-full bg-[#202428]/95 p-2 shadow-[0_20px_70px_rgba(0,0,0,.55)] ring-1 ring-white/10 backdrop-blur">
      <a data-nav="home" href="index.html" class="group flex min-h-12 touch-manipulation flex-col items-center justify-center rounded-full text-xs font-bold text-zinc-400 transition hover:bg-white/5 hover:text-white focus:outline-none focus:ring-2 focus:ring-[#fc4c02]/60 active:scale-95"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M9 20v-6h6v6"></path></svg><span class="mt-0.5">Home</span></a>
      <a data-nav="plan" href="plan.html" class="group flex min-h-12 touch-manipulation flex-col items-center justify-center rounded-full text-xs font-bold text-zinc-400 transition hover:bg-white/5 hover:text-white focus:outline-none focus:ring-2 focus:ring-[#fc4c02]/60 active:scale-95"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M3 10h18"></path></svg><span class="mt-0.5">Plan</span></a>
      <a data-nav="log" href="log.html" class="-mt-5 flex min-h-14 touch-manipulation flex-col items-center justify-center rounded-full bg-[#fc4c02] text-xs font-black text-white shadow-[0_16px_35px_rgba(252,76,2,.35)] transition hover:bg-[#ff6b2b] focus:outline-none focus:ring-2 focus:ring-[#fc4c02]/70 active:scale-95"><svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg><span class="mt-0.5">Log</span></a>
      <a data-nav="strength" href="strength.html" class="group flex min-h-12 touch-manipulation flex-col items-center justify-center rounded-full text-xs font-bold text-zinc-400 transition hover:bg-white/5 hover:text-white focus:outline-none focus:ring-2 focus:ring-[#fc4c02]/60 active:scale-95"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 17.5 17.5"></path><path d="M21 21 3 3"></path><path d="M14 5a3 3 0 0 1 5 2.2"></path><path d="M5 14a3 3 0 0 0 2.2 5"></path></svg><span class="mt-0.5">Strength</span></a>
      <a data-nav="progress" href="progress.html" class="group flex min-h-12 touch-manipulation flex-col items-center justify-center rounded-full text-xs font-bold text-zinc-400 transition hover:bg-white/5 hover:text-white focus:outline-none focus:ring-2 focus:ring-[#fc4c02]/60 active:scale-95"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="m7 14 4-4 3 3 5-6"></path></svg><span class="mt-0.5">Trend</span></a>
    </nav>
    <script src="app.js"></script>
  </main>
</body>
</html>
