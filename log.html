<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TriBuild Log</title><link rel="stylesheet" href="styles.css"></head><body data-page="log"><main class="app"><header class="top"><div><p class="kicker">Daily log</p><h1 class="title" id="logTitle">Day</h1><p class="subtitle" id="logDetail">Loading</p></div></header><section class="controls"><div class="control-card"><label>Week</label><select id="weekSelect"></select></div><div class="control-card"><label>Day</label><select id="daySelect"></select></div></section><section class="form-card card"><div class="form-grid"><label class="check"><input id="completed" type="checkbox"> Completed?</label><label>Actual minutes<input id="actual" type="number" min="0" max="300" placeholder="0"></label><label>RPE 1-10<input id="rpe" type="number" min="1" max="10" placeholder="5"></label><label>Achilles pain 0-10<input id="pain" type="number" min="0" max="10" placeholder="0"></label><label>Morning stiffness 0-10<input id="stiff" type="number" min="0" max="10" placeholder="0"></label><label class="check"><input id="flare" type="checkbox"> Next-day flare</label><label class="check"><input id="stride" type="checkbox"> Altered stride</label><label>Notes<textarea id="notes" rows="4" placeholder="How did it feel?"></textarea></label><button class="primary" id="save" type="button">Save log</button></div></section><section class="output card" id="logOutput"><span class="label">Tomorrow guide</span><strong class="big" id="logStatus">Not logged</strong><small class="small" id="logHint">Save today's log to get guidance.</small></section><nav class="bottom-nav"><a class="nav-link" data-page="home" href="index.html"><span>⌂</span>Home</a><a class="nav-link" data-page="plan" href="plan.html"><span>◷</span>Plan</a><a class="nav-link add" data-page="log" href="log.html"><span>＋</span>Log</a><a class="nav-link" data-page="body" href="body.html"><span>◴</span>Body</a><a class="nav-link" data-page="progress" href="progress.html"><span>◎</span>Trend</a></nav><script src="app.js"></script></main></body></html>
