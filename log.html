<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{fontFamily:{sans:["Inter","ui-sans-serif","system-ui","-apple-system","BlinkMacSystemFont","Segoe UI","Arial","sans-serif"]}}}}</script><title>Log</title></head><body data-page="log" class="bg-[#0b0d0f] text-white"><main class="mx-auto min-h-screen w-[min(430px,100%)] bg-[#111417] px-5 pb-28 pt-8"><header class="mb-5"><p class="text-xs font-black uppercase tracking-wider text-[#ff6b2b]">Daily log</p><h1 id="logTitle" class="mt-2 text-4xl font-black tracking-[-.06em]">Day</h1><p id="logDetail" class="mt-2 text-sm leading-5 text-zinc-400">Loading</p></header><section class="mb-4 grid grid-cols-2 gap-3"><label class="rounded-[24px] bg-[#202428] p-3 text-xs font-bold text-zinc-400 ring-1 ring-white/5">Week<select id="weekSelect" class="mt-2 h-12 w-full rounded-2xl bg-[#111417] px-3 text-base text-white outline-none"></select></label><label class="rounded-[24px] bg-[#202428] p-3 text-xs font-bold text-zinc-400 ring-1 ring-white/5">Day<select id="daySelect" class="mt-2 h-12 w-full rounded-2xl bg-[#111417] px-3 text-base text-white outline-none"></select></label></section><section class="rounded-[28px] bg-[#202428] p-5 shadow-[0_22px_70px_rgba(0,0,0,.34)] ring-1 ring-white/5"><div class="grid gap-4"><label class="flex items-center gap-3 text-sm font-bold text-zinc-200"><input id="completed" type="checkbox" class="h-5 w-5 accent-[#ff6b2b]">Completed?</label><label class="text-xs font-bold text-zinc-400">Actual minutes<input id="actual" type="number" min="0" max="300" class="mt-2 h-12 w-full rounded-2xl bg-[#111417] px-3 text-base text-white outline-none"></label><label class="text-xs font-bold text-zinc-400">RPE 1-10<input id="rpe" type="number" min="1" max="10" class="mt-2 h-12 w-full rounded-2xl bg-[#111417] px-3 text-base text-white outline-none"></label><label class="text-xs font-bold text-zinc-400">Achilles pain 0-10<input id="pain" type="number" min="0" max="10" class="mt-2 h-12 w-full rounded-2xl bg-[#111417] px-3 text-base text-white outline-none"></label><label class="text-xs font-bold text-zinc-400">Morning stiffness 0-10<input id="stiff" type="number" min="0" max="10" class="mt-2 h-12 w-full rounded-2xl bg-[#111417] px-3 text-base text-white outline-none"></label><label class="flex items-center gap-3 text-sm font-bold text-zinc-200"><input id="flare" type="checkbox" class="h-5 w-5 accent-[#ff6b2b]">Next-day flare</label><label class="flex items-center gap-3 text-sm font-bold text-zinc-200"><input id="stride" type="checkbox" class="h-5 w-5 accent-[#ff6b2b]">Altered stride</label><label class="text-xs font-bold text-zinc-400">Notes<textarea id="notes" rows="4" class="mt-2 w-full rounded-2xl bg-[#111417] p-3 text-base text-white outline-none"></textarea></label><button id="save" class="min-h-14 rounded-full bg-[#ff6b2b] text-base font-black text-white shadow-[0_16px_35px_rgba(255,107,43,.32)] transition active:scale-[.97]">Save log</button></div></section><section id="statusBox" class="mt-4 rounded-[28px] bg-[#202428] p-5 shadow-[0_22px_70px_rgba(0,0,0,.34)] ring-1 ring-white/5"><span class="text-xs font-black uppercase tracking-wider text-zinc-500">Tomorrow guide</span><strong id="logStatus" class="mt-2 block text-3xl font-black tracking-tight">Not logged</strong><p id="logHint" class="mt-1 text-sm leading-5 text-zinc-400">Save today's log to get guidance.</p></section><nav class="fixed inset-x-0 bottom-4 z-50 mx-auto grid w-[min(390px,calc(100%-28px))] grid-cols-5 gap-1 rounded-full bg-[#202428]/95 p-2 shadow-[0_20px_70px_rgba(0,0,0,.55)] ring-1 ring-white/10 backdrop-blur"><a data-nav="home" href="index.html" class="flex min-h-12 flex-col items-center justify-center rounded-full text-xs font-bold text-zinc-400 transition active:scale-95"><span class="text-lg">⌂</span>Home</a><a data-nav="plan" href="plan.html" class="flex min-h-12 flex-col items-center justify-center rounded-full text-xs font-bold text-zinc-400 transition active:scale-95"><span class="text-lg">◷</span>Plan</a><a data-nav="log" href="log.html" class="-mt-5 flex min-h-14 flex-col items-center justify-center rounded-full bg-[#ff6b2b] text-xs font-black text-white shadow-[0_16px_35px_rgba(255,107,43,.35)] transition active:scale-95"><span class="text-xl">＋</span>Log</a><a data-nav="body" href="body.html" class="flex min-h-12 flex-col items-center justify-center rounded-full text-xs font-bold text-zinc-400 transition active:scale-95"><span class="text-lg">◴</span>Body</a><a data-nav="progress" href="progress.html" class="flex min-h-12 flex-col items-center justify-center rounded-full text-xs font-bold text-zinc-400 transition active:scale-95"><span class="text-lg">◎</span>Trend</a></nav><script src="app.js"></script></main></body></html>
