<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TriBuild Daily Log</title><link rel="stylesheet" href="styles.css"></head><body data-page="daily"><main class="app">
<header class="header"><div><p class="tiny">Hello, Evan</p><h1>TriBuild</h1><p class="intro">A simple Achilles-aware triathlon training app for your 12-week BarryP base build.</p></div><div class="readiness" id="readinessCard"><span>Readiness</span><strong id="readinessText">Not logged</strong><small id="readinessHint">Log today to get a recommendation.</small></div></header>
<nav class="controls"><div class="field"><label for="weekSelect">Week</label><select id="weekSelect"></select></div><div class="field"><label for="daySelect">Day</label><select id="daySelect"></select></div><div class="field"><label for="longBike">Long bike</label><input id="longBike" type="number" min="45" max="240" value="90"></div><button class="reset" id="resetButton" type="button">Reset</button></nav>
<section class="daily-grid"><article class="log-card"><p class="tiny">Daily log</p><h2 id="dailyTitle">Day</h2><p id="dailyPlanSummary">Loading</p><div class="form"><label class="check"><input id="completedInput" type="checkbox"> Completed?</label><label>Actual minutes<input id="actualMinutesInput" type="number" min="0" max="300" placeholder="0"></label><label>RPE 1-10<input id="rpeInput" type="number" min="1" max="10" placeholder="5"></label><label>Achilles pain 0-10<input id="painInput" type="number" min="0" max="10" placeholder="0"></label><label>Morning stiffness 0-10<input id="stiffInput" type="number" min="0" max="10" placeholder="0"></label><label class="check"><input id="flareInput" type="checkbox"> Next-day flare</label><label class="check"><input id="strideInput" type="checkbox"> Altered stride</label><label>Notes<textarea id="notesInput" rows="4" placeholder="How did it feel?"></textarea></label><button class="primary" id="saveDailyButton" type="button">Save daily log</button></div></article><article class="output" id="dailyOutput"><span>Status</span><strong id="dailyStatusText">Not logged</strong><small id="dailyStatusHint">Save today's log to get tomorrow's guidance.</small></article></section>
<nav class="bottom-nav" aria-label="Mobile navigation"><a class="nav-link" data-page="home" href="index.html">⌂</a><a class="nav-link" data-page="planner" href="planner.html">◷</a><a class="nav-link add" data-page="daily" href="daily.html">＋</a><a class="nav-link" data-page="progress" href="progress.html">◎</a><a class="nav-link" data-page="roadmap" href="roadmap.html">↗</a></nav><script src="app.js"></script>
</main></body></html>
